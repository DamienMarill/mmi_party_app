<div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-4">
  @for (card of cards; track card.id) {
    <a [routerLink]="['/card/'+card.card_version?.id]" [appSound]="'card'">
      <app-mmii-card [count]="card.count" [cardVersion]="card.card_version"></app-mmii-card>
    </a>
  }
</div>
