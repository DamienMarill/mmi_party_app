<!-- ===================== -->
<!-- SIDEBAR DESKTOP (lg+) -->
<!-- ===================== -->
<aside class="hidden lg:flex fixed left-0 top-0 h-screen w-20 flex-col items-center py-6 gap-2 z-30 sidebar-desktop">
  <!-- Logo -->
  <a routerLink="/home" class="mb-6">
    <img src="/favicon.png" alt="MMI Party" class="w-10 h-10">
  </a>

  <!-- Nav links -->
  <nav class="flex flex-col gap-1 flex-1">
    <a routerLink="/home" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" [appSound]="'click'"
       class="sidebar-link">
      <fa-icon [icon]="iconsInactive.faHouse" class="is-inactive"></fa-icon>
      <fa-icon [icon]="iconsActive.faHouse" class="is-active"></fa-icon>
      <span class="sidebar-label">Accueil</span>
    </a>
    <a routerLink="/collection" routerLinkActive="active" [appSound]="'click'"
       class="sidebar-link">
      <fa-icon [icon]="iconsInactive.faBookSparkles" class="is-inactive"></fa-icon>
      <fa-icon [icon]="iconsActive.faBookSparkles" class="is-active"></fa-icon>
      <span class="sidebar-label">Collection</span>
    </a>
    <a routerLink="/trade" routerLinkActive="active" [appSound]="'click'"
       class="sidebar-link">
      <fa-icon [icon]="iconsInactive.faRightLeftLarge" class="is-inactive"></fa-icon>
      <fa-icon [icon]="iconsActive.faRightLeftLarge" class="is-active"></fa-icon>
      <span class="sidebar-label">Échange</span>
    </a>
    <a routerLink="/fight" routerLinkActive="active" [appSound]="'click'"
       class="sidebar-link">
      <fa-icon [icon]="iconsInactive.faSwords" class="is-inactive"></fa-icon>
      <fa-icon [icon]="iconsActive.faSwords" class="is-active"></fa-icon>
      <span class="sidebar-label">Combat</span>
    </a>
  </nav>
</aside>

<!-- ============================ -->
<!-- BOTTOM NAV MOBILE (< lg)     -->
<!-- ============================ -->
<div class="flex flex-col gap-2 fixed w-full bottom-0 z-20 lg:hidden" [@slideAnimation]="navConfig.showNav ? 'visible' : 'hidden'">
  <div class="flex justify-center" [@opacityAnimation]="navConfig.showBack ? 'visible' : 'hidden'">
    @if (navConfig.showBack) {
      <button (click)="goBack()" class="btn btn-circle border border-base-300 bg-base-100/90 center-shadow">
        <fa-icon [icon]="icons.faXmark" class=""></fa-icon>
      </button>
    }
  </div>

  <div class="btm-nav static text-xl" [@opacityAnimation]="navConfig.showNav ? 'visible' : 'hidden'">
    <a [routerLink]="['/home']" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" [appSound]="'click'">
      <fa-icon [icon]="iconsInactive.faHouse" class="is-inactive"></fa-icon>
      <fa-icon [icon]="iconsActive.faHouse" class=" is-active"></fa-icon>
    </a>
    <a [routerLink]="['/collection']" routerLinkActive="active" [appSound]="'click'">
      <fa-icon [icon]="iconsInactive.faBookSparkles" class=" is-inactive"></fa-icon>
      <fa-icon [icon]="iconsActive.faBookSparkles" class=" is-active"></fa-icon>
    </a>
    <a [routerLink]="['/trade']" routerLinkActive="active" [appSound]="'click'">
      <fa-icon [icon]="iconsInactive.faRightLeftLarge" class=" is-inactive"></fa-icon>
      <fa-icon [icon]="iconsActive.faRightLeftLarge" class=" is-active"></fa-icon>
    </a>
    <a [routerLink]="['/fight']" routerLinkActive="active" [appSound]="'click'">
      <fa-icon [icon]="iconsInactive.faSwords" class=" is-inactive"></fa-icon>
      <fa-icon [icon]="iconsActive.faSwords" class=" is-active"></fa-icon>
    </a>
  </div>
</div>
